aid: verta
name: Verta
description: Verta was an MLOps model-management, experiment-tracking, and model-registry platform (verta.ai)
  acquired by Cloudera on 2024-06-03; verta.ai now redirects to Cloudera Machine Learning. Its open-source
  core, ModelDB (Apache-2.0, github.com/VertaAI/modeldb), remains actively maintained and provides ML
  model versioning, metadata management, and experiment tracking. The REST API is a grpc-gateway transcoding
  of the ModelDB and UAC gRPC services — 11 services and 264 operations served under /v1 — covering projects,
  experiments, experiment runs, datasets, a model registry, Git-style versioning, deployment stages, monitoring,
  and SCIM/UAC access control.
