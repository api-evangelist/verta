openapi: 3.2.0
info:
  title: modeldb/.proto Dataset Service API
  version: version not set
servers:
- url: /v1
tags:
- name: DatasetService
paths:
  /dataset/addDatasetAttributes:
    post:
      operationId: DatasetService_addDatasetAttributes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbAddDatasetAttributesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbAddDatasetAttributes'
        required: true
      summary: Dataset service add dataset attributes
      x-summary-source: derived
  /dataset/addDatasetTags:
    post:
      operationId: DatasetService_addDatasetTags
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbAddDatasetTagsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbAddDatasetTags'
        required: true
      summary: Dataset service add dataset tags
      x-summary-source: derived
  /dataset/createDataset:
    post:
      operationId: DatasetService_createDataset
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbCreateDatasetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbCreateDataset'
        required: true
      summary: Dataset service create dataset
      x-summary-source: derived
  /dataset/deleteDataset:
    delete:
      operationId: DatasetService_deleteDataset
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbDeleteDatasetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbDeleteDataset'
        required: true
      summary: Dataset service delete dataset
      x-summary-source: derived
  /dataset/deleteDatasetAttributes:
    delete:
      operationId: DatasetService_deleteDatasetAttributes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbDeleteDatasetAttributesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbDeleteDatasetAttributes'
        required: true
      summary: Dataset service delete dataset attributes
      x-summary-source: derived
  /dataset/deleteDatasetTags:
    delete:
      operationId: DatasetService_deleteDatasetTags
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbDeleteDatasetTagsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbDeleteDatasetTags'
        required: true
      summary: Dataset service delete dataset tags
      x-summary-source: derived
  /dataset/deleteDatasets:
    delete:
      operationId: DatasetService_deleteDatasets
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbDeleteDatasetsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbDeleteDatasets'
        required: true
      summary: Dataset service delete datasets
      x-summary-source: derived
  /dataset/findDatasets:
    post:
      summary: queries
      operationId: DatasetService_findDatasets
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbFindDatasetsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbFindDatasets'
        required: true
  /dataset/getAllDatasets:
    get:
      operationId: DatasetService_getAllDatasets
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbGetAllDatasetsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      parameters:
      - name: page_number
        description: For pagination.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: ascending
        in: query
        required: false
        schema:
          type: boolean
      - name: sort_key
        in: query
        required: false
        schema:
          type: string
      - name: workspace_name
        in: query
        required: false
        schema:
          type: string
      tags:
      - DatasetService
      summary: Dataset service get all datasets
      x-summary-source: derived
  /dataset/getDatasetById:
    get:
      operationId: DatasetService_getDatasetById
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbGetDatasetByIdResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
      tags:
      - DatasetService
      summary: Dataset service get dataset by id
      x-summary-source: derived
  /dataset/getDatasetByName:
    get:
      operationId: DatasetService_getDatasetByName
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbGetDatasetByNameResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: workspace_name
        in: query
        required: false
        schema:
          type: string
      tags:
      - DatasetService
      summary: Dataset service get dataset by name
      x-summary-source: derived
  /dataset/getDatasetTags:
    get:
      operationId: DatasetService_getDatasetTags
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbGetTagsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
      tags:
      - DatasetService
      summary: Dataset service get dataset tags
      x-summary-source: derived
  /dataset/getExperimentRunByDataset:
    post:
      operationId: DatasetService_getExperimentRunByDataset
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbGetExperimentRunByDatasetResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbGetExperimentRunByDataset'
        required: true
      summary: Dataset service get experiment run by dataset
      x-summary-source: derived
  /dataset/getLastExperimentByDatasetId:
    get:
      operationId: DatasetService_getLastExperimentByDatasetId
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbLastExperimentByDatasetIdResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      parameters:
      - name: dataset_id
        in: query
        required: false
        schema:
          type: string
      tags:
      - DatasetService
      summary: Dataset service get last experiment by dataset id
      x-summary-source: derived
  /dataset/updateDatasetAttributes:
    post:
      operationId: DatasetService_updateDatasetAttributes
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbUpdateDatasetAttributesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbUpdateDatasetAttributes'
        required: true
      summary: Dataset service update dataset attributes
      x-summary-source: derived
  /dataset/updateDatasetDescription:
    post:
      operationId: DatasetService_updateDatasetDescription
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbUpdateDatasetDescriptionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbUpdateDatasetDescription'
        required: true
      summary: Dataset service update dataset description
      x-summary-source: derived
  /dataset/updateDatasetName:
    post:
      operationId: DatasetService_updateDatasetName
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/modeldbUpdateDatasetNameResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
      tags:
      - DatasetService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/modeldbUpdateDatasetName'
        required: true
      summary: Dataset service update dataset name
      x-summary-source: derived
components:
  schemas:
    vertamodeldbLocation:
      type: object
      properties:
        location:
          type: array
          items:
            type: string
    WorkspaceTypeEnumWorkspaceType:
      type: string
      enum:
      - UNKNOWN
      - ORGANIZATION
      - USER
      default: UNKNOWN
    versioningAptEnvironmentBlob:
      type: object
      properties:
        packages:
          type: array
          items:
            type: string
    modeldbGetExperimentRunByDataset:
      type: object
      properties:
        dataset_id:
          type: string
    commonGitSnapshot:
      type: object
      properties:
        filepaths:
          type: array
          items:
            type: string
        repo:
          type: string
        hash:
          type: string
        is_dirty:
          $ref: '#/components/schemas/TernaryEnumTernary'
    ArtifactTypeEnumArtifactType:
      type: string
      enum:
      - IMAGE
      - MODEL
      - TENSORBOARD
      - DATA
      - BLOB
      - STRING
      - CODE
      - CONTAINER
      default: IMAGE
    modeldbExperimentRun:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        experiment_id:
          type: string
        name:
          type: string
        description:
          type: string
        date_created:
          type: string
          format: int64
        date_updated:
          type: string
          format: int64
        start_time:
          type: string
          format: int64
        end_time:
          type: string
          format: int64
        code_version:
          type: string
        code_version_snapshot:
          $ref: '#/components/schemas/commonCodeVersion'
        parent_id:
          type: string
        environment:
          $ref: '#/components/schemas/versioningEnvironmentBlob'
          title: Requirement
        tags:
          type: array
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/commonKeyValue'
        hyperparameters:
          type: array
          items:
            $ref: '#/components/schemas/commonKeyValue'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/commonArtifact'
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/commonArtifact'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/commonKeyValue'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/modeldbObservation'
        features:
          type: array
          items:
            $ref: '#/components/schemas/modeldbFeature'
        job_id:
          type: string
        owner:
          type: string
        owner_id:
          type: string
          format: uint64
        group_owner_id:
          $ref: '#/components/schemas/commonGroupId'
        versioned_inputs:
          $ref: '#/components/schemas/modeldbVersioningEntry'
        code_version_from_blob:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/commonCodeVersion'
        version_number:
          type: string
          format: uint64
          title: Doc for version_number https://github.com/VertaAI/docs/pull/53
      title: ExperimentRun Entity
    commonCodeVersion:
      type: object
      properties:
        git_snapshot:
          $ref: '#/components/schemas/commonGitSnapshot'
        code_archive:
          $ref: '#/components/schemas/commonArtifact'
        date_logged:
          type: string
          format: uint64
      title: code version
    modeldbDeleteDatasetAttributesResponse:
      type: object
      properties:
        dataset:
          $ref: '#/components/schemas/modeldbDataset'
    modeldbExperiment:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        description:
          type: string
        date_created:
          type: string
          format: int64
        date_updated:
          type: string
          format: int64
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/commonKeyValue'
        tags:
          type: array
          items:
            type: string
        owner:
          type: string
        owner_id:
          type: string
          format: uint64
        group_owner_id:
          $ref: '#/components/schemas/commonGroupId'
        code_version_snapshot:
          $ref: '#/components/schemas/commonCodeVersion'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/commonArtifact'
        version_number:
          type: string
          format: uint64
          title: Doc for version_number https://github.com/VertaAI/docs/pull/53
    runtimeError:
      type: object
      properties:
        error:
          type: string
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/protobufAny'
    modeldbDeleteDatasetResponse:
      type: object
      properties:
        status:
          type: boolean
    modeldbDeleteDatasetTagsResponse:
      type: object
      properties:
        dataset:
          $ref: '#/components/schemas/modeldbDataset'
    TernaryEnumTernary:
      type: string
      enum:
      - UNKNOWN
      - 'TRUE'
      - 'FALSE'
      default: UNKNOWN
    protobufAny:
      type: object
      properties:
        type_url:
          type: string
        value:
          type: string
          format: byte
    modeldbGetAllDatasetsResponse:
      type: object
      properties:
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/modeldbDataset'
        total_records:
          type: string
          format: uint64
    versioningEnvironmentBlob:
      type: object
      properties:
        python:
          $ref: '#/components/schemas/versioningPythonEnvironmentBlob'
        docker:
          $ref: '#/components/schemas/versioningDockerEnvironmentBlob'
        environment_variables:
          type: array
          items:
            $ref: '#/components/schemas/versioningEnvironmentVariablesBlob'
        command_line:
          type: array
          items:
            type: string
        apt:
          $ref: '#/components/schemas/versioningAptEnvironmentBlob'
    modeldbUpdateDatasetName:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    DatasetTypeEnumDatasetType:
      type: string
      enum:
      - RAW
      - PATH
      - QUERY
      default: RAW
    modeldbUpdateDatasetAttributesResponse:
      type: object
      properties:
        dataset:
          $ref: '#/components/schemas/modeldbDataset'
    modeldbUpdateDatasetNameResponse:
      type: object
      properties:
        dataset:
          $ref: '#/components/schemas/modeldbDataset'
    versioningVersionEnvironmentBlob:
      type: object
      properties:
        major:
          type: integer
          format: int32
        minor:
          type: integer
          format: int32
        patch:
          type: integer
          format: int32
        suffix:
          type: string
    modeldbFindDatasetsResponse:
      type: object
      properties:
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/modeldbDataset'
        total_records:
          type: string
          format: int64
    modeldbCreateDatasetResponse:
      type: object
      properties:
        dataset:
          $ref: '#/components/schemas/modeldbDataset'
    modeldbGetDatasetByIdResponse:
      type: object
      properties:
        dataset:
          $ref: '#/components/schemas/modeldbDataset'
    modeldbLastExperimentByDatasetIdResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/modeldbExperiment'
    DatasetVisibilityEnumDatasetVisibility:
      type: string
      enum:
      - PRIVATE
      - PUBLIC
      - ORG_SCOPED_PUBLIC
      default: PRIVATE
    modeldbCreateDataset:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/commonKeyValue'
        dataset_visibility:
          $ref: '#/components/schemas/DatasetVisibilityEnumDatasetVisibility'
        dataset_type:
          $ref: '#/components/schemas/DatasetTypeEnumDatasetType'
        workspace_name:
          type: string
        time_created:
          type: string
          format: uint64
        custom_permission:
          $ref: '#/components/schemas/uacCollaboratorPermissions'
          title: 'The next field only makes sense when visibility == ORG_CUSTOM

            They will be empty otherwise'
        visibility:
          $ref: '#/components/schemas/uacResourceVisibility'
    modeldbVersioningEntry:
      type: object
      properties:
        repository_id:
          type: string
          format: uint64
        commit:
          type: string
        key_location_map:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/vertamodeldbLocation'
    versioningDockerEnvironmentBlob:
      type: object
      properties:
        repository:
          type: string
        tag:
          type: string
        sha:
          type: string
    modeldbGetTagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
    versioningEnvironmentVariablesBlob:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
    modeldbUpdateDatasetAttributes:
      type: object
      properties:
        id:
          type: string
        attribute:
          $ref: '#/components/schemas/commonKeyValue'
    CollaboratorTypeEnumCollaboratorType:
      type: string
      enum:
      - READ_ONLY
      - READ_WRITE
      default: READ_ONLY
    modeldbDeleteDatasetTags:
      type: object
      properties:
        id:
          type: string
        tags:
          type: array
          items:
            type: string
        delete_all:
          type: boolean
    uacCollaboratorPermissions:
      type: object
      properties:
        collaborator_type:
          $ref: '#/components/schemas/CollaboratorTypeEnumCollaboratorType'
        can_deploy:
          $ref: '#/components/schemas/TernaryEnumTernary'
        can_predict:
          $ref: '#/components/schemas/TernaryEnumTernary'
    modeldbDeleteDatasets:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
    modeldbAddDatasetTagsResponse:
      type: object
      properties:
        dataset:
          $ref: '#/components/schemas/modeldbDataset'
    modeldbGetDatasetByNameResponse:
      type: object
      properties:
        dataset_by_user:
          $ref: '#/components/schemas/modeldbDataset'
        shared_datasets:
          type: array
          items:
            $ref: '#/components/schemas/modeldbDataset'
    OperatorEnumOperator:
      type: string
      enum:
      - EQ
      - NE
      - GT
      - GTE
      - LT
      - LTE
      - CONTAIN
      - NOT_CONTAIN
      - IN
      - NOT_IN
      default: EQ
    modeldbUpdateDatasetDescription:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
    commonArtifact:
      type: object
      properties:
        key:
          type: string
        path:
          type: string
        path_only:
          type: boolean
        artifact_type:
          $ref: '#/components/schemas/ArtifactTypeEnumArtifactType'
        linked_artifact_id:
          type: string
        filename_extension:
          type: string
        serialization:
          type: string
        artifact_subtype:
          type: string
        upload_completed:
          type: boolean
    modeldbDeleteDatasetAttributes:
      type: object
      properties:
        id:
          type: string
        attribute_keys:
          type: array
          items:
            type: string
        delete_all:
          type: boolean
    commonKeyValue:
      type: object
      properties:
        key:
          type: string
        value:
          type: object
        value_type:
          $ref: '#/components/schemas/ValueTypeEnumValueType'
          description: "As per documentation of proto buffer 3.\n  For enums, the default value is the first defined enum value, which must be 0."
    modeldbAddDatasetTags:
      type: object
      properties:
        id:
          type: string
        tags:
          type: array
          items:
            type: string
    modeldbDeleteDataset:
      type: object
      properties:
        id:
          type: string
    modeldbDataset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        owner_id:
          type: string
          format: uint64
        group_owner_id:
          $ref: '#/components/schemas/commonGroupId'
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        dataset_visibility:
          $ref: '#/components/schemas/DatasetVisibilityEnumDatasetVisibility'
        dataset_type:
          $ref: '#/components/schemas/DatasetTypeEnumDatasetType'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/commonKeyValue'
        time_created:
          type: string
          format: uint64
        time_updated:
          type: string
          format: uint64
        workspace_id:
          type: string
        workspace_type:
          $ref: '#/components/schemas/WorkspaceTypeEnumWorkspaceType'
        workspace_service_id:
          type: string
          format: uint64
        custom_permission:
          $ref: '#/components/schemas/uacCollaboratorPermissions'
          title: 'The next field only makes sense when visibility == ORG_CUSTOM

