components:
  schemas:
    modeldbUpdateExperimentDescriptionResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/modeldbExperiment'
    modeldbAddAttributesResponse:
      type: object
      properties:
        status:
          type: boolean
    commonGitSnapshot:
      type: object
      properties:
        filepaths:
          type: array
          items:
            type: string
        repo:
          type: string
        hash:
          type: string
        is_dirty:
          $ref: '#/components/schemas/TernaryEnumTernary'
    ArtifactTypeEnumArtifactType:
      type: string
      enum:
      - IMAGE
      - MODEL
      - TENSORBOARD
      - DATA
      - BLOB
      - STRING
      - CODE
      - CONTAINER
      default: IMAGE
    commonCodeVersion:
      type: object
      properties:
        git_snapshot:
          $ref: '#/components/schemas/commonGitSnapshot'
        code_archive:
          $ref: '#/components/schemas/commonArtifact'
        date_logged:
          type: string
          format: uint64
      title: code version
    modeldbUpdateExperimentDescription:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
    modeldbExperiment:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        description:
          type: string
        date_created:
          type: string
          format: int64
        date_updated:
          type: string
          format: int64
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/commonKeyValue'
        tags:
          type: array
          items:
            type: string
        owner:
          type: string
        owner_id:
          type: string
          format: uint64
        group_owner_id:
          $ref: '#/components/schemas/commonGroupId'
        code_version_snapshot:
          $ref: '#/components/schemas/commonCodeVersion'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/commonArtifact'
        version_number:
          type: string
          format: uint64
          title: Doc for version_number https://github.com/VertaAI/docs/pull/53
    modeldbGetAttributesResponse:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/commonKeyValue'
    modeldbUpdateExperimentNameOrDescriptionResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/modeldbExperiment'
    runtimeError:
      type: object
      properties:
        error:
          type: string
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/protobufAny'
    modeldbGetExperimentsInProjectResponse:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/modeldbExperiment'
        total_records:
          type: string
          format: int64
    modeldbDeleteExperiments:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
    TernaryEnumTernary:
      type: string
      enum:
      - UNKNOWN
      - 'TRUE'
      - 'FALSE'
      default: UNKNOWN
    modeldbDeleteExperimentResponse:
      type: object
      properties:
        status:
          type: boolean
    protobufAny:
      type: object
      properties:
        type_url:
          type: string
        value:
          type: string
          format: byte
    modeldbDeleteExperimentTagResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/modeldbExperiment'
    modeldbDeleteExperimentTag:
      type: object
      properties:
        id:
          type: string
        tag:
          type: string
    modeldbUpdateExperimentName:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    modeldbLogExperimentCodeVersion:
      type: object
      properties:
        id:
          type: string
        code_version:
          $ref: '#/components/schemas/commonCodeVersion'
      title: code version
    modeldbGetExperimentByNameResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/modeldbExperiment'
    modeldbDeleteExperimentAttributesResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/modeldbExperiment'
    modeldbGetTagsResponse:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
    modeldbAddExperimentTagResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/modeldbExperiment'
    modeldbUpdateExperimentNameOrDescription:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    modeldbFindExperiments:
      type: object
      properties:
        project_id:
          type: string
        experiment_ids:
          type: array
          items:
            type: string
        predicates:
          type: array
          items:
            $ref: '#/components/schemas/commonKeyValueQuery'
        ids_only:
          type: boolean
        page_number:
          type: integer
          format: int32
          title: For pagination
        page_limit:
          type: integer
          format: int32
        ascending:
          type: boolean
        sort_key:
          type: string
        workspace_name:
          type: string
    modeldbDeleteExperimentTagsResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/modeldbExperiment'
    modeldbDeleteExperimentsResponse:
      type: object
      properties:
        status:
          type: boolean
    modeldbUpdateExperimentNameResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/modeldbExperiment'
    modeldbFindExperimentsResponse:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/modeldbExperiment'
        total_records:
          type: string
          format: int64
    modeldbDeleteExperiment:
      type: object
      properties:
        id:
          type: string
    modeldbAddExperimentTag:
      type: object
      properties:
        id:
          type: string
        tag:
          type: string
    modeldbLogExperimentArtifacts:
      type: object
      properties:
        id:
          type: string
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/commonArtifact'
      title: artifacts
    modeldbLogExperimentCodeVersionResponse:
      type: object
      properties:
        experiment:
          $ref: '#/components/schemas/modeldbExperiment'
    OperatorEnumOperator:
      type: string
      enum:
      - EQ
      - NE
      - GT
      - GTE
      - LT
      - LTE
      - CONTAIN
      - NOT_CONTAIN
      - IN
      - NOT_IN
      default: EQ
    commonArtifact:
      type: object
      properties:
        key:
          type: string
        path:
          type: string
        path_only:
          type: boolean
        artifact_type:
          $ref: '#/components/schemas/ArtifactTypeEnumArtifactType'
        linked_artifact_id:
          type: string
        filename_extension:
          type: string
        serialization:
          type: string
        artifact_subtype:
          type: string
        upload_completed:
          type: boolean
    modeldbGetExperimentCodeVersionResponse:
      type: object
      properties:
        code_version:
          $ref: '#/components/schemas/commonCodeVersion'
    commonKeyValue:
      type: object
      properties:
        key:
          type: string
        value:
          type: object
        value_type:
          $ref: '#/components/schemas/ValueTypeEnumValueType'
          description: "As per documentation of proto buffer 3.\n  For enums, the default value is the first defined enum value, which must be 0."
    modeldbAddExperimentAttributesResponse:
      type: object
