    modeldbAddProjectTagsResponse:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/modeldbProject'
    commonGitSnapshot:
      type: object
      properties:
        filepaths:
          type: array
          items:
            type: string
        repo:
          type: string
        hash:
          type: string
        is_dirty:
          $ref: '#/components/schemas/TernaryEnumTernary'
    modeldbMetricsSummary:
      type: object
      properties:
        key:
          type: string
        min_value:
          type: number
          format: double
        max_value:
          type: number
          format: double
    ArtifactTypeEnumArtifactType:
      type: string
      enum:
      - IMAGE
      - MODEL
      - TENSORBOARD
      - DATA
      - BLOB
      - STRING
      - CODE
      - CONTAINER
      default: IMAGE
    modeldbUpdateProjectAttributes:
      type: object
      properties:
        id:
          type: string
        attribute:
          $ref: '#/components/schemas/commonKeyValue'
    modeldbSetProjectReadme:
      type: object
