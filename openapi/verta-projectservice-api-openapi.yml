        id:
          type: string
        key:
          type: string
    TernaryEnumTernary:
      type: string
      enum:
      - UNKNOWN
      - 'TRUE'
      - 'FALSE'
      default: UNKNOWN
    protobufAny:
      type: object
      properties:
        type_url:
          type: string
        value:
          type: string
          format: byte
    modeldbDeleteProject:
      type: object
      properties:
        id:
          type: string
