          $ref: '#/components/schemas/commonGitSnapshot'
        code_archive:
          $ref: '#/components/schemas/commonArtifact'
        date_logged:
          type: string
          format: uint64
      title: code version
    modeldbFindProjectsResponse:
      type: object
