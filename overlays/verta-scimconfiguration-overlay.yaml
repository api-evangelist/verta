  update:
    x-verta-conventions:
      auth: email + developer key headers (VERTA_EMAIL / VERTA_DEV_KEY) or JWT (VERTA_JWT_TOKEN)
      pagination: page_number + page_limit request fields; total_records in responses
      error-envelope: grpc-gateway runtimeError { error, code, message, details[] } keyed to gRPC status
